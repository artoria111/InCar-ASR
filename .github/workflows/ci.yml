name: portable-ci

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v

  cpp-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build portable preprocessing, VAD, decoder, and WAV tests
        working-directory: modules/04_atlas_edge_deployment
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror \
            -Iinclude -c src/main.cpp -o /tmp/incar-asr-main.o
          c++ -std=c++17 -Wall -Wextra -Werror \
            -Iinclude -c src/asr_engine.cpp -o /tmp/incar-asr-engine.o
          c++ -std=c++17 -O2 -Wall -Wextra -Werror \
            -Iinclude \
            tests/test_core.cpp \
            src/audio_preprocess.cpp \
            src/vad_detector.cpp \
            src/ctc_decoder.cpp \
            src/utils.cpp \
            -o /tmp/incar-asr-core-tests
      - run: /tmp/incar-asr-core-tests
