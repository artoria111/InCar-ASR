<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <title>车载语音控制系统</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css" />

<style>
.door-indicator { transition: all 0.3s ease; }
.door-indicator.door-open {
  background: rgba(0,200,255,0.15) !important;
  border-color: rgba(0,200,255,0.4) !important;
  box-shadow: 0 0 8px rgba(0,200,255,0.2);
}
</style>

</head>
<body>
  <!-- Hidden elements for original JS compatibility -->
  <div id="sub-driver" style="display:none"></div>
  <div id="sub-model" style="display:none"></div>
  <div id="sub-tool" style="display:none"></div>

  <div class="page-container">
    <main class="cockpit-grid">
      <!-- 车窗控制 -->
      <section class="card" id="windows-card">
        <div class="card-header">
          <div class="card-title">车窗</div>
          <div class="card-tag">示意图</div>
        </div>
        <div class="windows-layout">
          <div class="window-controls-left">
            <div class="window-control-item">
              <div class="window-label">左前</div>
              <button class="btn window-toggle-btn" data-window-toggle="fl">打开</button>
            </div>
            <div class="window-control-item">
              <div class="window-label">左后</div>
              <button class="btn window-toggle-btn" data-window-toggle="rl">打开</button>
            </div>
          </div>
          <div class="window-visual-center">
            <div id="door-warning" style="display:none;background:rgba(255,60,60,0.15);color:#ff6060;padding:6px 12px;border-radius:6px;text-align:center;margin-bottom:8px;font-size:0.8em;"></div>
            <div class="car-schematic">
                <div class="windshield"></div>
                <div class="window-frame frame-fl" id="viz-fl"><div class="glass"></div></div><div id="door-fl" class="door-indicator" style="position:absolute;width:14px;height:30px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.15);border-radius:2px;left:62px;top:50px;transition:all 0.3s;"></div>
                <div class="b-pillar-left"></div>
                <div class="window-frame frame-rl" id="viz-rl"><div class="glass"></div></div>
                <div class="window-frame frame-fr" id="viz-fr"><div class="glass"></div></div>
                <div class="b-pillar-right"></div>
                <div class="window-frame frame-rr" id="viz-rr"><div class="glass"></div></div>
                <div class="rear-windshield"></div>
            </div>
            <div class="window-footer-buttons">
              <button class="btn btn-ghost" id="windows-open-all">全部打开</button>
              <button class="btn btn-ghost" id="windows-close-all">全部关闭</button>
            </div>
          </div>
          <div class="window-controls-right">
            <div class="window-control-item">
              <div class="window-label">右前</div>
              <button class="btn window-toggle-btn" data-window-toggle="fr">打开</button>
            </div>
            <div class="window-control-item">
              <div class="window-label">右后</div>
              <button class="btn window-toggle-btn" data-window-toggle="rr">打开</button>
            </div>
          </div>
        </div>
      </section>

      <!-- 音乐 -->
      <section class="card" id="media-card">
        <div class="card-header">
          <div class="card-title">音乐</div>
          <div class="pill-toggle"><span class="pill-dot"></span><span>蓝牙</span></div>
        </div>
        <div class="media-main">
          <div class="media-track-info">
            <div class="media-track-title" id="media-title">夜行天际</div>
            <div class="media-track-meta">
              <span id="media-artist">海洋公路</span>
              <span>• <span id="media-album">午夜疾驰</span></span>
            </div>
          </div>
          <div class="media-slider">
            <div class="progress-track"><div class="progress-fill media-progress-fill" id="media-progress"></div></div>
            <div class="media-time-row"><span id="media-current-time">0:00</span><span id="media-total-time">3:12</span></div>
          </div>
          <div class="media-controls">
            <div class="media-controls-left">
              <button class="btn btn-icon media-control-btn" id="media-prev" title="上一首"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 5v14" /><path d="M18 6l-8.5 6L18 18V6z" /></svg></span></button>
              <button class="btn btn-icon media-control-btn primary" id="media-play-pause" title="播放/暂停"><span class="icon" id="media-play-icon"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z" /></svg></span></button>
              <button class="btn btn-icon media-control-btn" id="media-next" title="下一首"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M18 5v14" /><path d="M6 6l8.5 6L6 18V6z" /></svg></span></button>
            </div>
            <div class="media-indicators">
              <div class="chip-equalizer" id="media-status-chip">
                  <div class="eq-bars"><div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div></div>
                  <span id="media-status-text" style="margin-left:4px;">已暂停</span>
              </div>
            </div>
          </div>
        </div>

        <!-- 语音控制 -->
        <div class="audio-assistant-section">
          <div class="subtle-label">语音控制</div>
          <div class="audio-controls">
            <select id="voice-select" style="display:none"><option>default</option></select>
            <button class="btn btn-voice" id="push-to-talk">
              <span class="voice-icon">
                <svg viewBox="0 0 24 24" fill="currentColor">
                  <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                  <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                </svg>
              </span>
              <span id="voice-btn-text">按住说话</span>
            </button>
          </div>
          <div class="audio-status-row">
            <div class="audio-indicator" id="audio-indicator">
              <div class="audio-wave"><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div></div>
              <span id="audio-status-text">就绪</span>
            </div>
          </div>
        </div>
      </section>

      <!-- 空调 -->
      <section class="card" id="climate-card">
        <div class="card-header">
          <div class="card-title">空调</div>
          <div class="climate-mode-pill">
            <span class="badge" id="ac-badge">关闭</span>
            <span id="ac-mode-text">空调系统</span>
          </div>
        </div>
        <div class="climate-layout">
          <div class="climate-temp-stack">
            <div class="subtle-label">座舱温度</div>
            <div class="climate-current"><span id="climate-current">26</span><span class="unit">°C</span></div>
            <div class="climate-target-row">
              <button class="btn btn-icon temp-step-btn" data-temp="down">-</button>
              <div>
                <div class="muted">设定</div>
                <div class="climate-target-value"><span id="climate-target">26</span>°</div>
              </div>
              <button class="btn btn-icon temp-step-btn" data-temp="up">+</button>
            </div>
            <div class="climate-status-row">
              <div class="climate-status-pill" id="climate-status-pill">
                <span class="dot"></span>
                <span id="climate-status-label">恒温</span>
              </div>
              <div class="climate-status-text" id="climate-status-text">正在保持座舱温度。</div>
            </div>
          </div>
          <div class="climate-right">
            <div id="fan-rotor" style="display:none"></div>
            <div id="climate-progress" style="display:none"></div>
            <div style="display:flex;justify-content:space-around;margin-bottom:12px;gap:8px;">
              <button class="btn" id="ac-toggle-btn" style="flex:1;padding:14px 6px;white-space:nowrap;" onclick="toggleAC()">❄️  空调: 关</button>
              <button class="btn" id="defrost-toggle-btn" style="flex:1;padding:14px 6px;white-space:nowrap;" onclick="toggleDefrost()">🌫 除雾: 关</button>
            </div>
            <div style="display:flex;justify-content:space-around;gap:8px;">
              <button class="btn" id="circ-toggle-btn" style="flex:1;padding:8px;" onclick="toggleCirc()">🔄 内循环: 关</button>
              <button class="btn" id="rear-def-btn" style="flex:1;padding:8px;white-space:nowrap;" onclick="toggleRearDef()">♨ 座椅加热: 关</button>
            </div>
            <div class="fan-wrapper">
              <div class="fan-icon">
                <div class="fan-rotor" id="fan-rotor-real">
                  <div class="fan-blades"><div class="fan-blade"></div><div class="fan-blade"></div><div class="fan-blade"></div></div>
                </div>
              </div>
              <div>
                <div class="fan-speed-label">风量 <span id="fan-level">2</span> 档</div>
                <div class="fan-buttons">
                  <button class="btn btn-small" data-fan="down">-</button>
                  <button class="btn btn-small" data-fan="up">+</button>
                </div>
                <div class="fan-speed-bar">
                  <div class="fan-speed-dot" data-fan-dot="1"></div>
                  <div class="fan-speed-dot" data-fan-dot="2"></div>
                  <div class="fan-speed-dot" data-fan-dot="3"></div>
                  <div class="fan-speed-dot" data-fan-dot="4"></div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- 导航 -->
      <section class="card" id="navigation-card">
        <div class="card-header">
          <div class="card-title">导航</div>
          <div class="card-tag">逐向导航</div>
        </div>
        <div class="nav-layout">
          <div class="nav-top-row">
            <div class="nav-destination">
              <div class="subtle-label">目的地</div>
              <div class="nav-destination-name" id="nav-destination-name">未设置目的地</div>
            </div>
            <div class="nav-buttons">
              <button class="btn" id="nav-set-destination">设置目的地</button>
              <button class="btn" id="nav-toggle">开始</button>
              <button class="btn btn-ghost" id="nav-clear">清除</button>
            </div>
          </div>
          <div class="nav-current-step">
            <div class="row-space">
              <div><div class="nav-step-text" id="nav-current-text">等待路线…</div><div class="nav-step-sub" id="nav-current-sub">&nbsp;</div></div>
              <div class="nav-badge badge-pulse" id="nav-status-badge">空闲</div>
            </div>
            <div class="nav-progress"><div class="progress-track"><div class="progress-fill" id="nav-progress"></div></div></div>
            <div class="nav-status" id="nav-status-text">路线未激活。</div>
          </div>
          <div><div class="subtle-label" style="margin-bottom:4px;">后续转向</div><ul class="nav-list" id="nav-list"></ul></div>
        </div>
      </section>
    </main>
  </div>
  <script src="script.js?v=3"></script>
  <script src="asr-bridge-v3.js?v=5"></script>
</body>
</html>
